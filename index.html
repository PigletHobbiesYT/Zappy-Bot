<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZappyBot ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>⚡ ZappyBot</h1>
            <p>Your mini AI assistant</p>
        </div>

        <div id="chat-box" class="chat-box">
            <div class="message bot">
                <strong>ZappyBot:</strong>
                Hey! 👋 I'm ZappyBot. What do you want to talk about?
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="message-input"
                placeholder="Talk to ZappyBot..."
            >

            <button id="send-button">Send ⚡</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
